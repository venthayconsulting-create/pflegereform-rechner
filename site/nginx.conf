# nginx.conf fuer pflegereform-rechner.de (Container nginx:alpine)
# Einbinden z. B.:
#   docker run -d -p 8080:80 \
#     -v $PWD/site:/usr/share/nginx/html:ro \
#     -v $PWD/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine
# TLS und HTTPS-Weiterleitung erledigt der vorgeschaltete Proxy. Dann dort HSTS setzen.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript application/json application/ld+json image/svg+xml;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30;

    # Zugriffe im kombinierten Format auf stdout (Docker-Logs). Klicks auf /go/... sind darin zaehlbar.
    # Aufbewahrung: Die Datenschutzerklaerung nennt 14 Tage. Docker-Logrotation entsprechend begrenzen.
    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json application/ld+json image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name pflegereform-rechner.de www.pflegereform-rechner.de _;

        root  /usr/share/nginx/html;
        index index.html;

        # Relative Weiterleitungen, damit sie hinter einem TLS-Proxy korrekt bleiben.
        absolute_redirect off;
        port_in_redirect  off;

        # Sicherheits-Header. CSP ohne externe Quellen.
        # Hinweis: add_header wird in Locations nicht vererbt, wenn dort selbst add_header steht.
        # Deshalb nutzen die Cache-Locations nur "expires", und /go/ wiederholt die Header bewusst.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
        # add_header Strict-Transport-Security "max-age=31536000" always;   # nur aktivieren, wenn HTTPS durchgaengig steht

        # Saubere Verzeichnis-URLs: /foo/index.html -> /foo/ (request_uri bleibt bei internen Redirects unveraendert)
        if ($request_uri ~ "^(?<sauber>.*)/index\.html(?:\?.*)?$") {
            return 301 $sauber/;
        }

        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        # Diese Konfiguration liegt im Projektordner, soll aber nicht ausgeliefert werden.
        location = /nginx.conf {
            return 404;
        }

        # Statische Assets: 7 Tage Cache. "expires" statt add_header, damit die Sicherheits-Header erhalten bleiben.
        location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
            expires 7d;
            try_files $uri =404;
        }

        location = /robots.txt  { expires 1d; }
        location = /sitemap.xml { expires 1d; }

        # Weiterleitungen zu Partnern. 302, damit Ziele jederzeit getauscht werden koennen.
        # Jeder Aufruf steht im access_log (stdout) und ist damit zaehlbar.
        location ^~ /go/ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;

            # TODO Affiliate-URL: Platzhalter leitet vorerst auf die passende Ratgeberseite zurueck.
            location ~ ^/go/pflegebox/?$   { return 302 /pflegehilfsmittel-pflegebox/; }   # TODO Affiliate-URL
            location ~ ^/go/hausnotruf/?$  { return 302 /hausnotruf-zuschuss/; }           # TODO Affiliate-URL
            location ~ ^/go/treppenlift/?$ { return 302 /wohnumfeld-zuschuss-treppenlift-bad/; } # TODO Affiliate-URL
            location ~ ^/go/bad/?$         { return 302 /wohnumfeld-zuschuss-treppenlift-bad/; } # TODO Affiliate-URL
            location ~ ^/go/24h-pflege/?$  { return 302 /verhinderungspflege-2026/; }      # TODO Affiliate-URL

            return 404;
        }
    }
}
